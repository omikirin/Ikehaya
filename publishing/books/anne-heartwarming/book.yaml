description: |
  本作はCryptoNinja二次創作小説である。陽気でお調子者な伊賀の忍・餡音(#009)が、里はずれで小さな茶屋を営んでいる。武器は団子、忍術は影縫い——けれど平和なこの時代、その術が縫い留めるのは敵ではなく、暖簾を揺らす風と、客のこころの小さなほつれだ。祖父への贈り物に迷う咲耶、絵が描けなくなったネム、甘いもの嫌いを装う猫又、休み方を知らない断、声の小さな凪紗、力加減に悩むアウン。一話にひとり、他クランの忍者がふらりと立ち寄り、一皿の団子とともに悩みがほどけていく。そして十六団子の日、いつも「ほどく側」だった餡音に、あたたかな番が回ってくる。事件も敵も出てこない、ほのぼのとして少し切ない全六話の連作日常譚。
