description: |
  本作はCryptoNinja(クリプトニンジャ)の二次創作小説である。雑賀の里を預かる三味線弾きの忍者・弁天は、頭領・孫市から任された里の管理に追われ、自分の音を後回しにして生きてきた。ある月夜、空を流れる虹色の文字を目にした彼女は、その書き手である伝令忍者・イチヤと祭の演目を共に作ることになる。祝詞の歌と三味線の音色に、筆が描く虹色の言葉が重なるたび、弁天の心は静かに揺れはじめる。亡き師匠との約束、届けられなかった手紙、祭の夜に交わされる想い。音と言葉が夜空にひとつの絵を描くとき、恋の物語が静かに結ばれる。全六話収録、全年齢向けの恋愛小説。
