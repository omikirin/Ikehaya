description: |
  忍の世界に、ただ一人「光の刃」を持つ男がいた。風魔クランの幹部・断。誰の術も通じぬ影の獣が里を襲った夜、その閃光刀だけが闇を裂いた。なぜ自分の刀だけが光るのか——首領アトザが明かしたのは、天から星が落ちた夜、窪地で光る刀を抱いて眠っていた赤子こそが断だったという過去。出自の謎を追って星窪へ向かった断を待つのは、同じ星の欠片を腕に宿す傀儡師・玄夜と、影の獣の大群だった。力の代償に腕を灼かれ、敗北に膝をつきながら、断は問い続ける。この光は、奪うためのものか、守るためのものか。スピードと光で駆け抜けるSF風忍者活劇。本作はCryptoNinja二次創作小説です。
