  名刀正宗を継いだ雑賀の少年・風太。自慢は誰よりも速い逃げ足だけ。祖父の遺刀は重く、風遁の術は逃げるためにしか使えない。そんな少年の前に現れたのは、隻眼の老剣客・疾風斎。「儂から逃げ切ってみせよ」——奇妙な弟子入りから始まる修行の日々。だが里には野盗くずれの抜け忍の影が忍び寄り、封じられた悪霊・百嵐が目覚める。逃げるための風を、守るための風へ。少年剣士の王道成長バトル、全6話。本作はCryptoNinja二次創作小説です。
