description: |
  戦乱の時代——里の外れに口を開けた根の国の裂け目から、人の負の念が澱となった「虚」が溢れ出す。甲賀の若き幻術師・巌は、術を使うたび大切な記憶の色を失う「幻術・漆黒」の代償に怯えながら、薬師の妻・桜と静かに暮らしていた。だが虚の脅威は里を呑み、敵対していた風魔の首領アトザとの停戦、そして共闘へと巌を押し出していく。封印の法「五色の結界」に必要なのは、帰り道を灯す者の命脈。名乗り出たのは、桜だった——。のちに「岩爺」と呼ばれる男の若き日、犠牲と誓いを描く歴史大河。公式の未確定メモ「岩爺の若い頃・妻『桜』案」に想を得た、CryptoNinja二次創作小説です。
