description: |
  岩爺とアトザらの手で封印された異界「根の国」。その地の底では、百足の忍ゴコウが百鬼の名を記した帳面を預かり、夜ごと巡る百鬼夜行の秩序を守っていた。だがある夜、名を呼ばれても答えぬ鬼が現れる。その名は帳面から墨ごと消えていた——。名を喰う形なき怪異「虚蟲」を追うゴコウは、封印の傷跡に澱んだ負の淀みと対峙し、やがて己の名までも喰われ始める。蜘蛛の同輩ささがねの糸を借り、百の足で夜の秩序を支え直す妖怪奇譚。本作はNFTコレクション「CryptoNinja」の二次創作小説です。
