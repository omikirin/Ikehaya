description: |
  雑賀の里の焙烙玉職人・雛之丞。硝石を挽き、火薬を練り、戦いのための玉を焼く毎日のなか、師・玄爺の死が彼に未完の帳面「祝い火」を遺した。殺すための火しか知らない手で、祝うための火——花火は作れるのか。里を預かる弁天から川開きの祭りの大花火を頼まれた雛之丞は、失敗を重ね、悪鬼「灰喰い」の襲撃で工房まで失う。それでも星を掛け、玉を貼り、導火を見極めて、彼は祭りの夜空にただ一発の大輪を賭ける。ものづくりの工程を丁寧に描く職人お仕事もの。本作はCryptoNinja二次創作小説です。
