description: |
  寿命を司る秘儀「泰山府君祭」を継ぐ風魔の若き術者イブキには、人の頭上に残りの命が墨の濃淡として視えてしまう。里はずれの府君堂を預かる彼のもとへ、命の灯を吸う灰色の蛾、齢を巻き戻す逆さ暦、死者の声だけを返す谷——六つの怪異が次々と持ち込まれる。その影に見え隠れするのは、命の帳簿の外に落ちた元術者「無戸」。死期の視える里人を前に、若き術者は帳簿を書き換えるのか、それとも読み終えるまで隣にいるのか。相棒ヤーマと歩む、典雅にして怪しき陰陽師怪異連作。本作はCryptoNinja二次創作小説です。
