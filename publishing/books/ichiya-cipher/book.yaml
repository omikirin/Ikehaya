description: |
  平和な時代の雑賀の里。伝令を専門とする若き忍イチヤは、「戦えない自分」にひそかな引け目を抱いていた。ある朝、里の旧蔵から二代前の伝令・文吾が遺した古文書が見つかる。記されていたのは五首の和歌——だが、その頭文字は密かな道しるべだった。折句、いろは四十七文字の数合わせ、そして虹の七色の鍵。三層の暗号を解き明かす先に眠る「里の宝」を、流れの盗掘屋まがきが狙う。甲賀から帰省した姉ネムと共に、イチヤは筆一本で謎と敵に立ち向かう。手がかりはすべて本文中に。あなたもイチヤと一緒に解ける、全年齢向けの本格暗号ミステリー。本書はCryptoNinja二次創作作品です。
