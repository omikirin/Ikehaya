description: |
  武器を持たない術者は、何をもって妹を守るのか。甲賀の里に暮らすイズナは、刃も弓も持たず、身に宿した霊獣「管」と飯綱の法だけを頼りに生きる姉である。初午の雪の日に生まれた妹・宇迦。早くに両親を亡くした姉妹は、二人きりで里の日々を紡いでいく。やがて妹の指先にともる狐火、里の冷たい視線、好敵手・於兎との出会い、そして山から忍び寄る病鬼の冬——派手な合戦ではなく、日々の小さな選択の積み重ねが、姉を、妹を、少しずつ変えていく。宇迦が九尾の焔を操る狐使いとして立つ日、イズナが選んだ「守り方」とは。静謐な筆致で描く姉妹の年代記。本作はCryptoNinja二次創作小説です。
