description: |
  平和な忍びの里・風魔で、薬売りの老人が毒殺された。死者の唇に残るのは蛇毒の痕——疑いの目は、毒手裏剣を操り白蛇オロチを口寄せする忍・蛇ノ目にまっすぐ向けられた。蟄居を命じられ、里じゅうの視線が変わっていくなか、ただ一人「あなたじゃない」と言ってくれたのは、後輩の呪符使いイブキだった。オロチの嗅覚が暴くのは、蛇のふりをした毒。疑われる者の孤独と、信じてくれる一人の重さを描く、無実証明クライムサスペンス。本作はCryptoNinja二次創作小説です。
