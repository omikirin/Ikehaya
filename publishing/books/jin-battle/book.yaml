description: |
  本作はCryptoNinja二次創作小説である。舞台は戦乱の時代——シーズン1。全ての忍者のルーツと呼ばれる伝説の忍・刃（Jin/#001）は、燃え続ける戦火から伊賀の里を守っていた。だが戦の裏には、里々の憎しみを煽る根の国の瘴気と、それを背負った風魔の初代首領・颪の影があった。火遁と手裏剣を武器に、刃は弟子の死という代償を越え、「焼き尽くす火」から「祓い、暖める火」へと己の術と信念を鍛え直す。灰噴山の火口で繰り広げられる最後の死闘の果て、刃が勝利と引き換えに遺したものとは。熱く、しかし戦争の重さを描く王道バトルアクション、全6話。
