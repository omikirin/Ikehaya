  山奥に暮らす伝説級の鍛冶職人・金鬼(Kana-Oni)。だが彼が今もっとも心血を注ぐのは、刀ではなく一本の牛刀——包丁である。里外れに構えた竈場「金鬼の台所」には、任務に疲れた忍びたちが今日も暖簾をくぐる。金遁の術で聞き当てた湧き水と食材、鬼の手が打った刃が生む一皿は、体の疲れだけでなく心の凝りまでほどいていく。稽古に行き詰まる結、旧い悔いを抱く岩爺、そして刀を打てなくなった金鬼自身。一話一品、湯気の向こうに人がほどける全六話のグルメ時代劇。本作はCryptoNinja二次創作小説です。
