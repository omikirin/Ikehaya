description: |
  伊賀の奥深い山中で、目立たぬように里を見守り続ける雷遁の忍・カルラ。ある夜、山に落ちるはずの雷が音もなく「消える」異変が起きる。積乱雲の中でカルラが見たのは、雷を喰らって肥え太る怪鳥・虚雷(うろずみ)だった。雷を導く術ごと喰われ、翼を焼かれて墜ちた初戦。家に伝わる迦楼羅天の伝承、独りで飛び続けた先祖の最期。カラスの日、里に雷禍が迫るとき、カルラは高度一万メートルの雲頂で最後の決戦に挑む。高度と風と雷の物理感覚で描く、縦の空戦バトル全6話。本作はCryptoNinja二次創作です。
