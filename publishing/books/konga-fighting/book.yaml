description: |
  甲賀の里で、くのいちたちを教えるコーチの忍・コンガ。かつて力任せの拳で仲間を守れなかった男は、拳を仕舞い、教えることに生きていた。だが宿場町に現れた無敵の用心棒・鵺垣玄骨が弟子を傷つけたとき、コンガは再び拳を握る——そして完敗する。届かぬ拳の理由は、おのれ自身の迷い。彼は影分身の術に懸け、自分自身と殴り合うという前代未聞の修行を発明する。おのれの癖と、逃げと、後悔を殴り倒した先に待つ再戦。素手のみで戦う漢の、単純で真っ直ぐで、泣ける熱血格闘譚。本作はCryptoNinja二次創作小説です。
