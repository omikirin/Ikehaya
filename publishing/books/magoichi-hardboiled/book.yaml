description: |
  必ず当たる弾を、一日にただ一発。雑賀クランの首領・孫市は里を弁天に任せ、海賊まがいの日々を海で送っていた。そんな男の船に流れ着いた依頼は、「撃ってはならない相手を撃て」という仕事——標的は、他ならぬ弁天だった。依頼を断った男に、廻船商の魔手が里へ伸びる。撃てば思う壺、撃たねば里が沈む。外れない銃を持つ忍者は、引き金を引かないことで何を守るのか。乾いた文体で綴る、銃を持つ忍者のハードボイルド全6話。本書はCryptoNinja二次創作作品です。
