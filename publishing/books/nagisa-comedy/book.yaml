description: |
  平和な時代の雑賀の里。口数の少ない密偵見習い・凪紗は、里を仕切る弁天の書類手違いで、雑賀忍術学園と甲賀くのいち塾に二重在籍になってしまう。「間違いです」の一言が言えないまま、得意の影分身で二校同時通学を敢行するが——無口すぎる分身の珍回答、本体と分身の入れ替わり事故、猫又の抜き打ち検査、空腹で半透明になる分身と、綱渡りの日々は加速するばかり。そして迎えた二校同日の修了試験、術はついに満座の中でほどける。だがそのとき凪紗を待っていたのは、思いもよらないあたたかな真実だった。ドタバタの果てに、ほろりと泣ける学園コメディ。本書はCryptoNinja二次創作の小説作品です。
