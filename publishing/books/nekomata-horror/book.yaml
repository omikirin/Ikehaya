description: |
  CryptoNinja二次創作の和風ホラー小説。海辺の里に暮らす雑賀の忍・猫又(#021)は、ある夜、腰に差した妖刀村正が鞘の中で囁いていることに気づく。折しも里では「眠っているはずの猫又を夜半に見た」という噂が立ちはじめ、桟橋には雨も降らぬのに濡れた足跡が続いていた。影分身の術の残滓か、それとも——。記憶の空白、昼に現れるもう一人の自分、そして刀が告げる「おまえが影だ」という囁き。同郷の久遠の猫の目にも、猫又が猫又のままでいられる未来が見えなくなったとき、彼が最後に選ぶのは刀を抜くことではなかった。気配と音と違和感で織り上げる、読後にひとつ冷たい後味を残す全6話。
