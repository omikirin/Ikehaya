  本作はCryptoNinja二次創作小説である。描いたものに命を吹き込む忍術「動植綵絵」を操る甲賀の絵師忍者ネム。自由気ままに絵筆を走らせてきた彼女は、里の祭を彩る大壁画を任された日から、なぜか一枚も「生きた絵」を描けなくなってしまう。焦り、逃げ出し、筆を置いた彼女を呼び戻したのは、弟イチヤが空に綴る虹色の文字と、色を吸う悪霊に灰色へ染められていく花畑、そして子どもが地面に描いた不器用な落書きだった。上手さではなく、心で描く——描けなくなった絵師の再生を描く、青春・芸術ものの全6話。
