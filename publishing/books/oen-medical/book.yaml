description: |
  糸で脈を診る忍術「糸脈」と、薬箱の笈を背負い、里から里へ——雑賀の生まれで甲賀に学ぶ若き旅医者おえんの、一話一患者の連作人情医療譚。炭焼きの咳、食を絶った宿場の娘、偽薬の流言、そして「診ても治さぬ」謎の隠居医。治せる病を治しながら、おえんはやがて治せない病の前に立たされる。医者にできることは、薬か、それとも——。糸のむこうに人がいる。静かに沁みる、江戸情緒ただよう全六話。本作はCryptoNinja二次創作作品です。
