description: |
  幸福な未来を選び取る術「猫の目の選択」を持つ長命の忍・久遠。彼の瞳には、選ばれなかった無数の人生の分岐が「陽炎の路」として視え続けている。平和な雑賀の里で、ある子どもの未来がすべて黒く塗り潰れて視えたとき、久遠は鬼火を掲げ、久しく閉ざしていた路へ渡る。術を捨てた自分、猫又のそばで老いた自分、友を救えなかった自分——選ばなかった千の生を旅するたび、現実の記憶は薄れていく。路の奥で待つ影「虚ろ日」の正体とは。選ぶことの痛みと祝福を描く、切なく哲学的な時間ファンタジー。本書はCryptoNinja二次創作作品です。
