description: |
  己の身を差し出し、他者の災厄を肩代わりする最終手段の忍術「人身御供」。伊賀の里を守護する母・令は、その術の正体を娘の結に隠し続けてきた。だが里外れの祠から悪霊「澱」が漏れ出した日、二十年帰らなかった父・岩爺が敷居をまたぐ。かつて同じ術に妻を奪われた父、術を継ごうとする娘、独りで背負おうとする母――三世代の確執の果てに、令が娘にのこすものとは。犠牲と母性が静かに重なる家族のドラマ。本作はCryptoNinja二次創作小説です。
