description: |
  「言っとくが、俺は悪党だ」——風魔クランの毒使い・呂屯(ロットン)。首領格アトザの部下として、誰もやりたがらない汚れ仕事を請け負う裏稼業「腐れ屋」を営んでいる。だが困ったことに、この男、悪ぶるほどに善行が漏れる。報酬は芋三本、毒はなぜか殺さない濃度。ある日、宿場を偽薬と借金証文で締め上げる商人一味「宵蔵一家」の後始末が舞い込んだ。毒霧に喉を灼かれ、悪党を演じ損ね、それでも彼は悪党のやり方で片を付ける——悪名を、全部ひとりで被って。汚れ仕事の裏に隠れた不器用な忠義と人情を描く、ダークコメディ・ピカレスク全6話。本書はCryptoNinja二次創作作品です。
