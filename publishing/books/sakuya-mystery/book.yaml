description: |
  CryptoNinja二次創作ミステリー小説。平和な時代の里で、光る物ばかりが消える連続失せ物事件が発生する。甲賀の忍・咲耶は口寄せの術で呼び出した白鼠・烏・狸の「人ならざる目撃証言」を集めて謎を追うが、一件だけ手口の異なる事件が残り、疑いは自らの家族——祖父・岩爺、母のように慕う令、いとこの結——へと向かっていく。動物たちの証言の食い違い、季節外れの桜の花弁、内側から解かれた紐。フェアに置かれた手がかりを繋ぎ、咲耶がたどり着く真相は、家族を結び直そうとする一つの優しい嘘だった。忍者×日常の謎、読者が解ける本格連作ミステリー。
