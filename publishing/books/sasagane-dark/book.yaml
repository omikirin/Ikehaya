description: |
  封印された異界・根の国。蜘蛛をモチーフにした花魁風の忍者ささがねは、禿のヤミとヨミを従え、人の想いを喰らわねば形を保てぬ飢えとともに、光の射さぬ庭で永い時を過ごしていた。ある夜、封印の綻びから盲目の糸取り娘・灯里が落ちてくる。喰らうために拾ったはずの少女は、ささがねの糸を「あたたかい」と紡ぎ、その名を呼んだ。飢えを忘れさせる束の間の交流。しかし闇の底では名もなき飢えの澱「虚」が少女の匂いに目を覚ます。少女を人の世へ帰す唯一の代償は、彼女の中の想いの糸をすべて啜り、己を忘れさせること——。人を襲う性と、それでも捨てられなかった一筋の糸。妖異悲哀ダークで描く、封印された側から見た孤独と業の物語。本書はCryptoNinja二次創作小説です。
