description: |
  根の国を追われた忍・サスラ。地上と地下の狭間「境(あわい)」を流離う彼には、帰る場所がない。影から影へ滑る術「影繰」は、使うほどに己の輪郭と記憶を削っていく。かつての縁である蜘蛛の花魁ささがね、発明家シンラの残した灯り、そして敵として斬り結ぶ里の忍——出会いのすべてが、彼に「帰れない」ことを突きつける。それでもサスラは歩く。帰る場所の不在ごと、己として。喪失と受容を描く全6話のロードノベル。本作はCryptoNinja二次創作作品です。サスラの忍術・武器など公式未設定の部分は本作独自の解釈で補っています。
