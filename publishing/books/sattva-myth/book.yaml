description: |
  かつて忍であった神サットヴァは、天界の伽藍「白蓮の座」で亡魂を彼岸へ渡す務めを負っていた。だがある夜、渡した魂の一つが、忘れたはずの名を囁く——「小夜」。それは、人であった頃に守れなかった、たった一人の少女の名だった。神の掟に背き地上へ降りたサットヴァを待つのは、供養されぬ死者の嘆きが凝った怨霊「灰帝」。鎮めの術・涅槃を放つたび、人であった頃の記憶が一片ずつ剥がれ落ちていく。神の務めと人の未練、そのはざまで揺れる魂の行方を荘厳な筆致で描く神話幻想譚。本作はCryptoNinja二次創作作品です。
