description: |
  名刀大典太を腰に佩きながら、生涯それを抜かぬことを極意とした伊賀の老剣豪・石舟斎。
  平和な時代、剣の要らぬ里の片隅で静かに老いていく彼のもとへ、ある冬の朝、炭焼きの孫娘・千代が弟子入りを乞いに現れる。腕は立つのに「斬れない」ことを恥じる少女に、老人は遠い夜の己の罪を見た。
  薪割りと歩法だけの奇妙な稽古。里に忍び寄る浪人一党の影。そして、抜かぬままの最後の立ち合い——。
  斬らないことの強さを描く、静かな老剣豪時代小説。本作はCryptoNinja二次創作作品です。
