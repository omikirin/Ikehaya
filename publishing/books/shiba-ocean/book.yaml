description: |
  ふだんは犬の姿で暮らす雑賀の忍・柴(シバ)。流れ着いた漁村「汐鳴の浦」で穏やかな日々を過ごしていたある夜、海賊「鱶鰭一味」の魔の手が村に迫る。柴は忍術で人型に変化し、水遁と空手を武器に立ち上がった。しかし海の上では勝手が違う。幻の霧に敗れ荒海に沈んだ柴を拾ったのは、海賊狩りの首領・孫市だった。潮を読み、波を纏い、柴は再び立つ。大時化の夜、村人たちと共に挑む総力戦、そして水中での頭目との決戦。波と潮の匂いに満ちた、明朗快活な海洋忍者活劇。本作はCryptoNinja二次創作小説です。
