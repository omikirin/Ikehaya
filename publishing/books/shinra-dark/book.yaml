description: |
  人々が捨てた悔恨、嫉妬、恐怖——負の感情は澱となって地の底へ流れ落ち、封印された異界「根の国」に溜まっていく。その澱から生まれた発明家の忍者シンラは、澱を材料に器械を組みながら、自分を生んだ「一人分の悔恨」の主を探し続けていた。封印の綻びから漏れ聞こえた少女の泣き声。その悔恨は、シンラ自身の核と同じ味がした。己の存在の根を知ったとき、シンラは「在り続けること」と「還すこと」のどちらを選ぶのか。負の感情を糧とする存在の生と救いを、具体的な事件と情景で描く哲学ダークファンタジー。本作はCryptoNinja二次創作小説です。
