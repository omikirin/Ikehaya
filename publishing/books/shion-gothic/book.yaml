description: |
  触れる者すべてを傷つける「守りの棘」——野アザミの術を纏う伊賀の少女・紫苑。棘は彼女を鬼から守り、同時に人の輪から遠ざけていた。滅んだ故郷の集落跡で出会ったのは、棘に触れても傷つかない不思議な少女・棘乃。初めての友との日々は、しかし残酷な真実を孕んでいた。棘乃は死んだ子どもたちの想いが宿るまぼろしであり、紫苑の孤独を糧に存在していたのだ。灰の怪異が友を呑み込むとき、少女は初めて助けを求め、棘の意味を編み替える。孤独と喪失、そして再生を耽美に描くゴシックダーク忍法帖。本作はCryptoNinja二次創作作品です。
