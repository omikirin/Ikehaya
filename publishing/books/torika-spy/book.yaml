description: |
  伊賀の忍・酉花は、毒手裏剣を操る「毒の花」。隣国・久瀬藩の城下に薬種問屋の売り子として三年、草(スリーパー)として潜んできた。ある日、城下で原因不明の昏倒者が続出する。唇に残るのは、酉花にしか見抜けぬ毒の痕。調べを進める彼女の前に現れたのは、抜け忍と毒師の外道集団「空蟬衆」。やがて味方の裏切りにより正体は敵に露見し、酉花は追われる草となる。祭りの夜、水源に毒を撒こうとする敵の頭目を前に、毒師の彼女が選んだのは、毒を「使わない」という刃だった。裏切りと正体露見のサスペンスで畳みかける、スパイスリラー忍法帖。本作はCryptoNinja二次創作小説です。
