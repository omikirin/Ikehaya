description: |
  大陸から嵐の海を越え、甲賀の里に流れ着いた太極拳の拳士シャオラン。師父と交わした「学んだ拳をひとつも殺しに使うな。拳で人を活かせ」という約束を胸に、口寄せの相棒パンダ・リーリーとともに、居候として里の日々を送っていた。だが里の水源を狙う剛拳の武芸集団「黒風老一味」が現れ、その頭目の拳にシャオランは故郷の影を見る。柔よく剛を制す太極拳の理合を核に、受け流し、聴き、そして解き放つ——約束と居場所をめぐる全6話の武侠アクション。ジャッキー映画のようなユーモアも一匙。本書はCryptoNinja二次創作作品です。
